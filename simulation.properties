forceCalculationMethod=octree
# forceCalculationMethod=naive
# simulation=1
parallel=true
numShapes=5000
dt=4000000.0
# Higher is lower quality simulation, but faster
octree_theta=0.5
sandbox_width=5.2e6
#Figure out units here
mass=598910
maximum_runtime=150
# Multiplier for collision detection distance (1.0 = realistic, higher = more collisions/merging)
collision_radius_multiplier=30.0
# Stop growing multiplier when this fraction of particles have merged (0.0 to 1.0)
merge_target_fraction=0.9
# Target time in seconds to reach merge_target_fraction (at 24 fps)
merge_target_seconds=120
# Velocity damping per frame (1.0 = no damping, 0.999 = slight damping)
velocity_damping=0.9995
# Soft boundary strength (0 = disabled, higher = stronger inward force)
boundary_strength=0.001
