forceCalculationMethod=octree
parallel=true

# ---------------------------------------------------------------- scenario ---
# What gets built at t=0. See configs/ for more, and SCENARIOS.md for the knobs.
#   explicit | cluster | pair | chaotic | diamond
scenario.type=diamond
scenario.name=default-diamond

# Target ratio of kinetic to gravitational energy at t=0.
#   0.1-0.3 cold collapse (violent infall, the good footage)
#   ~0.5    virial equilibrium, slow and stately
#   >1.0    unbound, everything flies apart
# A negative value leaves the archetype's own velocities alone.
scenario.virial_ratio=0.3

diamond.groups=8
diamond.ring_radius=2.6e7
diamond.infall=0.5
diamond.swirl=0.35
diamond.spin=0.25

# ------------------------------------------------------------------- scale ---
# Per-group defaults that the archetypes build on.
numShapes=5000
mass=598910
sandbox_width=5.2e6

# --------------------------------------------------------------- integrator --
# dt=auto picks the timestep from the scenario's own crossing time, so a bigger
# arrangement doesn't silently play back slower. Set a number to pin it.
dt=auto
frames_per_crossing=400

# Higher is lower quality simulation, but faster
octree_theta=0.5
maximum_runtime=150

# ---------------------------------------------------------------- merging ----
# Multiplier for collision detection distance (1.0 = realistic, higher = more merging)
collision_radius_multiplier=30.0
# Stop growing multiplier when this fraction of particles have merged (0.0 to 1.0)
merge_target_fraction=0.9
# Target time in seconds to reach merge_target_fraction (at 24 fps)
merge_target_seconds=120
# Minimum merges per frame (guarantees progress toward the merge target)
minimum_merges_per_frame=10

# ----------------------------------------------------------- keeping it in ---
# Velocity damping per frame (1.0 = no damping, 0.999 = slight damping)
velocity_damping=0.9995
# Soft boundary strength (0 = disabled, higher = stronger inward force)
boundary_strength=0.001
# Boundary sits this far out, as a multiple of the starting system radius
boundary_radius_factor=1.5

# On-screen size of a body, in pixels, from the cube root of its mass. Physical
# radius is far below one pixel at these distances, so without this every
# particle draws the same and a big merged body looks like it vanished.
max_point_size=14
