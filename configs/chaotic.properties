# Several groups scattered and falling inward. Different seeds give genuinely
# different runs, which makes this the one to sample when batching.
scenario.type=chaotic
scenario.name=chaotic
scenario.virial_ratio=0.25

chaotic.groups=7
chaotic.spread=3.0e7
chaotic.size_fraction=0.18
chaotic.infall=0.5
chaotic.tangential=0.35
chaotic.spin_max=0.4
chaotic.mass_spread=2.5
chaotic.thickness=0.25
chaotic.dispersion=0.15

# --- scale -------------------------------------------------------------------
numShapes=40000
mass=598910
sandbox_width=5.2e6

# --- integrator --------------------------------------------------------------
dt=auto
frames_per_crossing=400
forceCalculationMethod=octree
parallel=true
octree_theta=0.5
maximum_runtime=150

# --- merging -----------------------------------------------------------------
collision_radius_multiplier=30.0
merge_target_fraction=0.9
merge_target_seconds=120
minimum_merges_per_frame=10

# --- keeping it in frame -----------------------------------------------------
velocity_damping=0.9995
boundary_strength=0.001
boundary_radius_factor=1.5

# On-screen size of a body, in pixels, from the cube root of its mass. Physical
# radius is far below one pixel at these distances, so without this every
# particle draws the same and a big merged body looks like it vanished.
max_point_size=14

# Ceiling on the collision multiplier ramp, and cap on how far a merge may
# shift a body, as a fraction of the starting system radius. The allowance
# scales inversely with how large the body draws, so specks still merge freely
# while grown bodies can't teleport. 0 on either disables that limit.
max_collision_radius_multiplier=120
max_merge_jump_fraction=0.02

# ------------------------------------------------------------------ camera ---
# The auto-scaling camera holds still until the framing is properly wrong, then
# eases to the new distance. Zooming in is deliberately slower than zooming out:
# losing the action off the edge of frame is worse than sitting a little too far
# back, and a collapse shouldn't drag the camera in behind it.
camera_zoom_out_rate=0.06
camera_zoom_in_rate=0.012
# Start adjusting once the target framing differs by more than this fraction...
camera_deadband=0.18
# ...and keep adjusting until within this fraction of it.
camera_settle=0.04
