# Two clouds on a grazing pass. Tidal tails live around impact_parameter
# 0.4-0.9; drop it to 0 for a head-on smash, raise approach_speed past 1.0
# for an unbound flyby.
scenario.type=pair
scenario.name=pair-grazing
scenario.virial_ratio=-1

pair.separation=5.0e7
pair.impact_parameter=0.6
pair.approach_speed=0.7
pair.mass_ratio=1.0
pair.spin_a=0.4
pair.spin_b=0.4
pair.dispersion=0.12

# --- scale -------------------------------------------------------------------
numShapes=4000
mass=598910
sandbox_width=5.2e6

# --- integrator --------------------------------------------------------------
dt=auto
frames_per_crossing=400
forceCalculationMethod=octree
parallel=true
octree_theta=0.5
maximum_runtime=150

# --- merging -----------------------------------------------------------------
collision_radius_multiplier=30.0
merge_target_fraction=0.9
merge_target_seconds=120
minimum_merges_per_frame=10

# --- keeping it in frame -----------------------------------------------------
velocity_damping=0.9995
boundary_strength=0.001
boundary_radius_factor=1.5

# On-screen size of a body, in pixels, from the cube root of its mass. Physical
# radius is far below one pixel at these distances, so without this every
# particle draws the same and a big merged body looks like it vanished.
max_point_size=14

# Ceiling on the collision multiplier ramp, and cap on how far a merge may
# shift a body, as a fraction of the starting system radius. The allowance
# scales inversely with how large the body draws, so specks still merge freely
# while grown bodies can't teleport. 0 on either disables that limit.
max_collision_radius_multiplier=120
max_merge_jump_fraction=0.02
