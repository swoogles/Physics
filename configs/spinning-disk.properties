# Enough rotation that the collapse lands in a plane instead of a ball.
# The camera looks down the z axis, so the spin axis is x here: that shows the
# disk edge-on, as a bright equatorial band with plumes off the poles. Spin
# about z would give the same physics viewed face-on, which reads as a circle.
scenario.type=cluster
scenario.name=spinning-disk
scenario.virial_ratio=0.35

cluster.radius=2.0e7
cluster.count=25000
cluster.mass=4.8e9
cluster.spin=1,0,0
cluster.dispersion=0.15

# --- scale -------------------------------------------------------------------
numShapes=4000
mass=598910
sandbox_width=5.2e6

# --- integrator --------------------------------------------------------------
dt=auto
frames_per_crossing=400
forceCalculationMethod=octree
parallel=true
octree_theta=0.5
maximum_runtime=150

# --- merging -----------------------------------------------------------------
collision_radius_multiplier=30.0
merge_target_fraction=0.9
merge_target_seconds=120
minimum_merges_per_frame=10

# --- keeping it in frame -----------------------------------------------------
velocity_damping=0.9995
boundary_strength=0.001
boundary_radius_factor=1.5

